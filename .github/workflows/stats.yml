
name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"   
  workflow_dispatch:        
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar SVGs
        env:
          GH_USERNAME: gpaulovit
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python generate_stats.py

      - name: Commitar SVGs atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/stats.svg dist/top-langs.svg
          git diff --cached --quiet && echo "Nada novo para commitar" || git commit -m "chore: atualizar stats do GitHub"
          git push
